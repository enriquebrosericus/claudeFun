version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mlb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mlb_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"      # offset to avoid conflicts with other postgres instances
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlb -d mlb_stats"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cloudflare WARP egress proxy ───────────────────────────────────────────
  # MLB's origin returns 406 for any CDN cache-miss coming from this host's
  # datacenter IP. WARP gives a clean Cloudflare egress IP; the scraper routes
  # its outbound HTTP through it (see *_PROXY on the scraper service). The image
  # ships its own healthcheck, so the scraper can wait for it to be healthy.
  warp:
    image: caomingjun/warp
    container_name: mlb_warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - mlb_warp_data:/var/lib/cloudflare-warp
    networks:
      - monitoring

  # ── MLB Stats Scraper ──────────────────────────────────────────────────────
  scraper:
    build: .
    container_name: mlb_stats_scraper
    restart: unless-stopped
    environment:
      TEAM_ID: "136"           # Seattle Mariners
      TEAM_ABBR: "SEA"
      SEASON: "2026"
      POLL_INTERVAL: "1800"    # 30 min baseline; auto-shortens during/after games
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      # Route MLB API traffic through the WARP proxy (socks5h = resolve DNS at
      # the proxy). NO_PROXY keeps DB/local traffic off the proxy.
      HTTP_PROXY: socks5h://warp:1080
      HTTPS_PROXY: socks5h://warp:1080
      NO_PROXY: postgres,localhost,127.0.0.1
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      warp:
        condition: service_healthy

  # ── Web frontend — "The Mariner's Almanac" (dev/frontend) ──────────────────
  # Repointed from the old Dockerfile.web dashboard; nginx still proxies web:8080
  # and haproxy still routes whackbat.techbrose.com → nginx, so neither changes.
  web:
    build:
      context: .
      dockerfile: Dockerfile.almanac
    container_name: mlb_web
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      SEASON: "2026"
      TEAM_ABBR: "SEA"
    ports:
      - "8080:8080"
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy

  # ── Nginx (SSL termination + reverse proxy) ────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: mlb_nginx
    restart: unless-stopped
    command: ["/bin/sh", "-c", "mkdir -p /etc/nginx/ssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/key.pem -out /etc/nginx/ssl/cert.pem -subj '/CN=whackbat.techbrose.com' && nginx -g 'daemon off;'"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "447:443"
    networks:
      - monitoring
    depends_on:
      - grafana
      - web

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: mlb_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_LOGIN_COOKIE_NAME: grafana_session_mlb
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/team_overview.json
    volumes:
      - mlb_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - postgres

networks:
  monitoring:
    driver: bridge

volumes:
  mlb_postgres_data:
  mlb_grafana_data:
  mlb_warp_data:
